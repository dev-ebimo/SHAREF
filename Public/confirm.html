<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Verified | Sharef</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Reusing your base layout variables and background styles -->
    <link rel="stylesheet" href="verify.css">
    <style>
        /* Specific overrides to create a centered, sleek success card */
        .success-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            padding: 2rem;
        }

        .success-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 3rem 2.5rem;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(20px);
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animated Premium Success Checkmark */
        .icon-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(168, 85, 247, 0.1);
            border-radius: 50%;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        .icon-pulse {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid var(--accent-purple);
            animation: iconPulseRing 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }

        @keyframes iconPulseRing {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .icon-wrapper svg {
            width: 40px;
            height: 40px;
            color: #a855f7;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 0.8s ease-in-out 0.3s forwards;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        .success-card h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.75rem;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .success-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Progress Redirect Track */
        .redirect-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Fallback Manual Navigation Link */
        .manual-link {
            display: block;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #a855f7;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }
        .manual-link:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- Ambient Atmospheric Background Elements from verify.css -->
    <div class="bg bg1" aria-hidden="true"></div>
    <div class="bg bg2" aria-hidden="true"></div>

    <div class="success-container">
        <main class="success-card">
            <div class="icon-wrapper">
                <div class="icon-pulse"></div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>

            <h1>Verification Successful</h1>
            <p>Your institutional email has been successfully verified. Welcome to the core ecosystem.</p>

            <div class="redirect-box">
                <div class="spinner"></div>
                <span>Redirecting to home page in <span id="countdown">4</span>s...</span>
            </div>

            <a href="dashboard.html" class="manual-link">Click here if you aren't redirected</a>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const countdownSpan = document.getElementById("countdown");
            let timeLeft = 4; // Give them an instant (4 seconds) to appreciate the success state

            const interval = setInterval(() => {
                timeLeft--;
                countdownSpan.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    // Standard routing placeholder—this will point to your home route
                    window.location.href = "dashboard.html"; 
                }
            }, 1000);
        });
    </script>
</body>
</html>
